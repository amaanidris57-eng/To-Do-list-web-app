<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<h1>My Tasks</h1>

<div class="input-row">
<input type="text" id="taskInput" placeholder="What needs doing?" autocomplete="off">
<button id="addBtn">Add task</button>
</div>

<p id="counter" class="counter"></p>
<ul id="taskList"></ul>
<p id="emptyMsg" class="empty">No tasks yet. Add your first one above.</p>
</main>

<script src="script.js"></script>
</body>
</html>
